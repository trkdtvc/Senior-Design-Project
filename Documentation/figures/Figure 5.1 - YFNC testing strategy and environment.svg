<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1350" viewBox="0 0 2200 1350">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#24486b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17365d" flood-opacity="0.16"/>
    </filter>
    <style>
      .title{font-family:'Times New Roman',serif;font-size:54px;font-weight:700;fill:#17365d}
      .subtitle{font-family:'Times New Roman',serif;font-size:27px;fill:#536b80}
      .layerTitle{font-family:'Times New Roman',serif;font-size:32px;font-weight:700;fill:#17365d}
      .layerText{font-family:'Times New Roman',serif;font-size:22px;fill:#2e4357}
      .small{font-family:'Times New Roman',serif;font-size:19px;fill:#536b80}
      .envTitle{font-family:'Times New Roman',serif;font-size:27px;font-weight:700;fill:#17365d}
      .envText{font-family:'Times New Roman',serif;font-size:21px;fill:#2e4357}
      .flow{stroke:#24486b;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="2200" height="1350" fill="#ffffff"/>
  <text x="1100" y="85" text-anchor="middle" class="title">YFNC Testing Strategy and Environment</text>
  <text x="1100" y="132" text-anchor="middle" class="subtitle">Layered verification from source quality to complete user workflows</text>

  <!-- Strategy layers -->
  <rect x="130" y="205" width="1320" height="215" rx="24" fill="#e4dfec" stroke="#675f8f" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="260" cy="312" r="62" fill="#ffffff" stroke="#675f8f" stroke-width="3"/>
  <text x="260" y="305" text-anchor="middle" class="layerTitle">4</text>
  <text x="260" y="340" text-anchor="middle" class="small">workflow</text>
  <text x="380" y="278" class="layerTitle">System and End-to-End Testing</text>
  <text x="380" y="323" class="layerText">Selenium exercises public browser flows; two-user manual scenarios verify</text>
  <text x="380" y="358" class="layerText">authentication, navigation, messaging, presence, permissions, and interface behavior.</text>
  <rect x="1150" y="268" width="235" height="88" rx="14" fill="#ffffff" stroke="#675f8f" stroke-width="3"/>
  <text x="1268" y="304" text-anchor="middle" class="envTitle">User level</text>
  <text x="1268" y="334" text-anchor="middle" class="small">complete application</text>

  <rect x="210" y="465" width="1160" height="200" rx="24" fill="#d9eaf7" stroke="#2f5597" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="325" cy="565" r="57" fill="#ffffff" stroke="#2f5597" stroke-width="3"/>
  <text x="325" y="576" text-anchor="middle" class="layerTitle">3</text>
  <text x="430" y="530" class="layerTitle">Integration Testing</text>
  <text x="430" y="574" class="layerText">Supertest verifies protected HTTP routes and the interaction between</text>
  <text x="430" y="609" class="layerText">middleware, controllers, services, models, and structured responses.</text>
  <rect x="1110" y="520" width="205" height="88" rx="14" fill="#ffffff" stroke="#2f5597" stroke-width="3"/>
  <text x="1213" y="556" text-anchor="middle" class="envTitle">API level</text>
  <text x="1213" y="586" text-anchor="middle" class="small">feature flows</text>

  <rect x="290" y="710" width="1000" height="190" rx="24" fill="#eaf2f8" stroke="#5b7f9f" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="400" cy="805" r="54" fill="#ffffff" stroke="#5b7f9f" stroke-width="3"/>
  <text x="400" y="816" text-anchor="middle" class="layerTitle">2</text>
  <text x="500" y="773" class="layerTitle">Unit Testing</text>
  <text x="500" y="807" class="layerText">Jest isolates token, validation, permission,</text>
  <text x="500" y="840" class="layerText">transaction, migration, and storage behavior.</text>
  <text x="500" y="873" class="small">Additional suites cover rate limits, email, errors, and presence.</text>
  <rect x="1065" y="759" width="180" height="88" rx="14" fill="#ffffff" stroke="#5b7f9f" stroke-width="3"/>
  <text x="1155" y="795" text-anchor="middle" class="envTitle">Code level</text>
  <text x="1155" y="825" text-anchor="middle" class="small">isolated behavior</text>

  <rect x="370" y="945" width="840" height="175" rx="24" fill="#fff2cc" stroke="#9a7b32" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="475" cy="1032" r="50" fill="#ffffff" stroke="#9a7b32" stroke-width="3"/>
  <text x="475" y="1043" text-anchor="middle" class="layerTitle">1</text>
  <text x="570" y="1005" class="layerTitle">Static Verification</text>
  <text x="570" y="1049" class="layerText">ESLint checks source quality, while the Vite production build</text>
  <text x="570" y="1084" class="layerText">verifies module resolution and deployable frontend output.</text>

  <!-- upward connectors -->
  <path d="M790 945 V900" class="flow"/>
  <path d="M790 710 V665" class="flow"/>
  <path d="M790 465 V420" class="flow"/>

  <!-- Environment panel -->
  <rect x="1535" y="205" width="535" height="915" rx="26" fill="#f7fafc" stroke="#8aa8c3" stroke-width="4" filter="url(#shadow)"/>
  <text x="1803" y="270" text-anchor="middle" class="layerTitle">Controlled Test Environment</text>
  <line x1="1590" y1="302" x2="2015" y2="302" stroke="#b4c6d5" stroke-width="3"/>

  <rect x="1590" y="342" width="425" height="120" rx="16" fill="#fff2cc" stroke="#9a7b32" stroke-width="3"/>
  <text x="1625" y="385" class="envTitle">Runtime and packages</text>
  <text x="1625" y="424" class="envText">Node.js 22.12.0 · npm 10</text>

  <rect x="1590" y="495" width="425" height="120" rx="16" fill="#d9eaf7" stroke="#2f5597" stroke-width="3"/>
  <text x="1625" y="538" class="envTitle">Backend test runner</text>
  <text x="1625" y="577" class="envText">Jest 30 · Supertest 7</text>

  <rect x="1590" y="648" width="425" height="120" rx="16" fill="#eaf2f8" stroke="#5b7f9f" stroke-width="3"/>
  <text x="1625" y="691" class="envTitle">Browser verification</text>
  <text x="1625" y="730" class="envText">Selenium WebDriver · Chrome</text>

  <rect x="1590" y="801" width="425" height="120" rx="16" fill="#e4dfec" stroke="#675f8f" stroke-width="3"/>
  <text x="1625" y="844" class="envTitle">Application services</text>
  <text x="1625" y="883" class="envText">React/Vite · Express · MySQL 8</text>

  <rect x="1590" y="954" width="425" height="120" rx="16" fill="#ffffff" stroke="#5b7f9f" stroke-width="3"/>
  <text x="1625" y="997" class="envTitle">Continuous verification</text>
  <text x="1625" y="1036" class="envText">GitHub Actions on push and pull request</text>

  <rect x="130" y="1185" width="1940" height="100" rx="20" fill="#17365d"/>
  <text x="1100" y="1228" text-anchor="middle" font-family="'Times New Roman',serif" font-size="27" font-weight="700" fill="#ffffff">Testing principle</text>
  <text x="1100" y="1264" text-anchor="middle" font-family="'Times New Roman',serif" font-size="23" fill="#e6eef5">Fast isolated checks support broader API validation, followed by browser and real-user workflow verification.</text>
</svg>
