<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#09111d" flood-opacity="0.34"/>
    </filter>
    <style>
      .title{font-family:'Times New Roman',serif;font-size:52px;font-weight:700;fill:#17365d}
      .subtitle{font-family:'Times New Roman',serif;font-size:25px;fill:#5d7085}
      .ui{font-family:Arial,sans-serif;fill:#e7edf6}
      .uiMuted{font-family:Arial,sans-serif;fill:#8e9baa}
      .uiStrong{font-family:Arial,sans-serif;font-weight:700;fill:#f3f6fa}
      .callTitle{font-family:'Times New Roman',serif;font-size:25px;font-weight:700;fill:#17365d}
      .callText{font-family:'Times New Roman',serif;font-size:20px;fill:#334b62}
      .line{stroke:#7794af;stroke-width:3;fill:none}
