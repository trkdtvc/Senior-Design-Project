name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      PORT: "5000"
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      API_PUBLIC_URL: http://localhost:5000
      SWAGGER_ENABLED: "false"
      TRUST_PROXY_HOPS: "0"
      UPLOAD_DIR: uploads
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: ci_database
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-1234567890
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 587
      MAIL_SECURE: "false"
      MAIL_USER: ci@example.com
      MAIL_PASS: ci-mail-password
      MAIL_FROM: Chatster CI <ci@example.com>
      AI_PROVIDER: local
      AI_PROVIDER_TIMEOUT_MS: "45000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration
        run: npm run config:check

      - name: Run backend tests
        run: npm test

      - name: Audit backend dependencies
        run: npm audit --audit-level=high

  frontend:
    name: Frontend lint, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
